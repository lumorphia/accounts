name: accounts
x-app: &app
  image: ghcr.io/lumorphia/accounts-app:${ACCOUNTS_TAG:?ACCOUNTS_TAG is required}
  env_file: ${ACCOUNTS_ENV_FILE:-.env.production}
  environment:
    NODE_ENV: production
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks: [backend]
  stop_grace_period: 35s

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: accounts
    volumes: [pgdata:/var/lib/postgresql]
    networks: [backend]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U accounts -d accounts]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    working_dir: /repo
    command: [node, packages/db/src/migrate.ts]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  web:
    <<: *app
    networks:
      backend:
      edge:
        aliases: [accounts-web]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
  characters:
    <<: *app
    command: [node, --import, ./server/sentry.ts, ./server/character-worker.ts]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  accounts:
    <<: *app
    command: [node, --import, ./server/sentry.ts, ./server/account-worker.ts]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  backup:
    image: ghcr.io/lumorphia/accounts-backup:${ACCOUNTS_TAG:?ACCOUNTS_TAG is required}
    env_file: ${ACCOUNTS_BACKUP_ENV_FILE:-.env.backup}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
    restart: unless-stopped

networks:
  backend:
  edge:
    external: true
    name: lumorphia-edge
volumes:
  pgdata:
