name: publish-images

# 公開判断を終えた main の sha のみを明示的にビルド・公開する。
on:
  workflow_dispatch:

concurrency:
  group: publish-accounts
  cancel-in-progress: false
permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.1.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          build-args: APP_VERSION=${{ github.sha }}
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ghcr.io/lumorphia/accounts-app:sha-${{ github.sha }}
          cache-from: type=gha,scope=accounts-app
          cache-to: type=gha,scope=accounts-app,mode=max
      - name: backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup/Dockerfile
          push: true
          tags: ghcr.io/lumorphia/accounts-backup:sha-${{ github.sha }}
          cache-from: type=gha,scope=accounts-backup
          cache-to: type=gha,scope=accounts-backup,mode=max
