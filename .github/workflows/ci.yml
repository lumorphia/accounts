name: ci

# 検査は PR でだけ回す。develop / main への push (= マージ) では、PR で確かめた中身を回し直さない。
# public リポジトリなので Actions の時間は org の上限を使わない (ADR-0002)。E2E も PR ごとに回す
on:
  pull_request:

# 同じ PR への連続 push で古い run を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # @lumorphia/* (lumorphia/platform) を GitHub Packages から読む
  packages: read

env:
  DATABASE_URL: postgres://accounts:accounts@127.0.0.1:5432/accounts

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: accounts
          POSTGRES_PASSWORD: accounts
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounts -d accounts"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lumorphia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      # CI=true なので、DATABASE_URL が無いと DB テストは skip ではなく失敗する (packages/db/src/require-database.ts)
      - run: pnpm test:coverage
      - run: pnpm build

  # https の accounts.lumorphia.test で回す (ADR-0002)。証明書は手元と同じスクリプトで作る
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: accounts
          POSTGRES_PASSWORD: accounts
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounts -d accounts"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lumorphia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm dev:certs
      # Chromium 本体は Playwright の版でキャッシュし、OS のライブラリだけ毎回入れる
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # ブランドの E2E はトップ (lumorphia/website、public) も起動する (ADR-0014)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lumorphia/website
          ref: develop
          path: website
          persist-credentials: false
      - run: pnpm e2e
        env:
          WEBSITE_DIR: website
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # シークレットの混入と高リスクの脆弱性。lumorphia/platform の再利用ワークフロー (platform ADR-0009)。
  # 版 (アクション・gitleaks・Node) は platform で上げ、ここの固定は Renovate が上げる
  security:
    permissions:
      contents: read
      packages: read
    uses: lumorphia/platform/.github/workflows/security.yml@f09c5000438dc7f4a9184b1a0e1717ff852c8b51 # main
    with:
      github-packages: true

  docker:
    runs-on: ubuntu-latest
    needs: [check, e2e, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.1.1
      - name: 本番 compose の構文
        run: |
          cp .env.production.example .env.production
          cp .env.backup.example .env.backup
          docker compose --env-file .env.production -f compose.prod.yaml config --quiet
      - name: app image (公開しない)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          build-args: APP_VERSION=${{ github.sha }}
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}
          push: false
          cache-from: type=gha,scope=accounts-app
          cache-to: type=gha,scope=accounts-app,mode=max
      - name: backup image (公開しない)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup/Dockerfile
          push: false
          cache-from: type=gha,scope=accounts-backup
          cache-to: type=gha,scope=accounts-backup,mode=max
