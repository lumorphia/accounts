name: ci

# 検査は PR でだけ回す。develop / main への push (= マージ) では、PR で確かめた中身を回し直さない。
# public リポジトリなので Actions の時間は org の上限を使わない (ADR-0002)。E2E も PR ごとに回す。
# main への push では release-please と、リリースができたときのイメージの公開だけを回す (ADR-0016)
on:
  pull_request:
  push:
    branches: [main]

# 同じ PR への連続 push で古い run を取り消す。main ではイメージの公開を途中で止めない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # @lumorphia/* (lumorphia/platform) を GitHub Packages から読む
  packages: read

env:
  DATABASE_URL: postgres://accounts:accounts@127.0.0.1:5432/accounts

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: accounts
          POSTGRES_PASSWORD: accounts
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounts -d accounts"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lumorphia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      # CI=true なので、DATABASE_URL が無いと DB テストは skip ではなく失敗する (packages/db/src/require-database.ts)
      - run: pnpm test:coverage
      - run: pnpm build

  # https の accounts.lumorphia.test で回す (ADR-0002)。証明書は手元と同じスクリプトで作る
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: accounts
          POSTGRES_PASSWORD: accounts
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounts -d accounts"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lumorphia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm dev:certs
      # Chromium 本体は Playwright の版でキャッシュし、OS のライブラリだけ毎回入れる
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # ブランドの E2E はトップ (lumorphia/website、public) も起動する (ADR-0014)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lumorphia/website
          ref: develop
          path: website
          persist-credentials: false
      - run: pnpm e2e
        env:
          WEBSITE_DIR: website
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # シークレットの混入と高リスクの脆弱性。lumorphia/platform の再利用ワークフロー (platform ADR-0009)。
  # 版 (アクション・gitleaks・Node) は platform で上げ、ここの固定は Renovate が上げる
  security:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: lumorphia/platform/.github/workflows/security.yml@f09c5000438dc7f4a9184b1a0e1717ff852c8b51 # main
    with:
      github-packages: true

  # PR では、イメージのビルドと本番の compose の構文が通るかだけを確かめる (公開しない)
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [check, e2e, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.1.1
      - name: 本番 compose の構文
        run: |
          cp .env.production.example .env.production
          cp .env.backup.example .env.backup
          docker compose --env-file .env.production -f compose.prod.yaml config --quiet
          docker compose --env-file .env.production -f compose.restore-test.yaml config --quiet
      - name: app image (公開しない)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          build-args: APP_VERSION=${{ github.sha }}
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}
          push: false
          cache-from: type=gha,scope=accounts-app
          cache-to: type=gha,scope=accounts-app,mode=max
      - name: backup image (公開しない)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup/Dockerfile
          push: false
          cache-from: type=gha,scope=accounts-backup
          cache-to: type=gha,scope=accounts-backup,mode=max

  # main に積まれた Conventional Commits から release-please がリリース PR (package.json の version と
  # CHANGELOG.md) を開き直す。そのリリース PR をマージした push でリリース (vX.Y.Z のタグと GitHub Release) が
  # でき、publish がイメージを作る (ADR-0016)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN が開いた PR では ci が走らない (Actions の再帰防止)。リリース PR は version と CHANGELOG だけ
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # リリースができたときだけ app と backup のイメージを作る。sha-<コミット> で上げ、両方できてから同じイメージに
  # vX.Y.Z と latest を付ける。本番は latest を pull するので「latest = リリース済み」になる (ADR-0016)
  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.1.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # イメージに埋めるバージョン。番号は release-please がリリース PR で package.json に書いたもの、sha はこのコミット
      - name: APP_VERSION
        id: version
        shell: bash
        run: echo "version=$(jq -r .version package.json)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ghcr.io/lumorphia/accounts-app:sha-${{ github.sha }}
          cache-from: type=gha,scope=accounts-app
          cache-to: type=gha,scope=accounts-app,mode=max
      - name: backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup/Dockerfile
          push: true
          tags: ghcr.io/lumorphia/accounts-backup:sha-${{ github.sha }}
          cache-from: type=gha,scope=accounts-backup
          cache-to: type=gha,scope=accounts-backup,mode=max
      - name: sha-xxx のイメージに vX.Y.Z と latest を付ける
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          for image in accounts-app accounts-backup; do
            src="ghcr.io/lumorphia/${image}:sha-${GITHUB_SHA}"
            docker buildx imagetools create -t "ghcr.io/lumorphia/${image}:${TAG}" -t "ghcr.io/lumorphia/${image}:latest" "$src"
          done
